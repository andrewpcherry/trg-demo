<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60-Second Roof Assessment | Texas Roof Guardians</title>
<meta name="description" content="Answer a few quick questions about your roof and get the right next step from Texas Roof Guardians.">
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
#assessmentFrame{display:block;width:100%;height:100vh;border:0;background:#fff}
.fallback{position:fixed;inset:auto 14px 14px 14px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 14px;font:13px/1.4 Arial,sans-serif;box-shadow:0 5px 20px rgba(0,0,0,.12);z-index:10}
.fallback a{font-weight:700;color:#024e7c}
</style>
</head>
<body>
<iframe id="assessmentFrame" title="Texas Roof Guardians 60-Second Roof Assessment" src="../trg-funnel/"></iframe>
<noscript><div class="fallback">Please enable JavaScript or <a href="../trg-funnel/">open the roof assessment here</a>.</div></noscript>
<script>
(function(){
  var frame=document.getElementById('assessmentFrame');
  var assessmentUrl=new URL(frame.getAttribute('src'),window.location.href);
  var incoming=new URLSearchParams(window.location.search);
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(key){
    var value=incoming.get(key);
    if(value)assessmentUrl.searchParams.set(key,value.slice(0,200));
  });
  frame.src=assessmentUrl.toString();
  var MAIN=new URL('index.html',window.location.href).href;
  var PRIVACY=new URL('privacy.html',window.location.href).href;
  var TERMS=new URL('terms.html',window.location.href).href;

  function topLink(a,href){
    if(!a)return;
    a.setAttribute('href',href);
    a.setAttribute('target','_top');
  }

  function enhance(){
    var doc;
    try{doc=frame.contentDocument||frame.contentWindow.document;}catch(e){return;}
    if(!doc||!doc.body)return;

    /* Make the funnel behave as a genuine extension of the main TRG website. */
    topLink(doc.querySelector('header.site .logo'),MAIN);

    var headCta=doc.querySelector('header.site .head-cta');
    if(headCta&&!doc.getElementById('trg-main-site-link')){
      var home=doc.createElement('a');
      home.id='trg-main-site-link';
      home.href=MAIN;
      home.target='_top';
      home.textContent='Main Website';
      home.style.cssText='font-size:12px;font-weight:800;color:#00416a;text-decoration:none;white-space:nowrap';
      headCta.insertBefore(home,headCta.firstChild);
    }

    var footer=doc.querySelector('footer .wrap');
    if(footer&&!doc.getElementById('trg-integrated-legal')){
      var legal=doc.createElement('div');
      legal.id='trg-integrated-legal';
      legal.style.cssText='width:100%;padding-top:14px;margin-top:6px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;line-height:1.7';
      legal.innerHTML='<a href="'+MAIN+'" target="_top" style="color:#d7e2ec">Texas Roof Guardians Main Website</a> &nbsp;·&nbsp; <a href="'+PRIVACY+'" target="_top" style="color:#d7e2ec">Privacy Policy</a> &nbsp;·&nbsp; <a href="'+TERMS+'" target="_top" style="color:#d7e2ec">Terms &amp; Conditions</a>';
      footer.appendChild(legal);
    }


  }

  frame.addEventListener('load',function(){
    enhance();
    try{
      var doc=frame.contentDocument||frame.contentWindow.document;
      var obs=new MutationObserver(enhance);
      obs.observe(doc.documentElement,{childList:true,subtree:true});
    }catch(e){}
  });
})();
</script>
</body>
</html>
